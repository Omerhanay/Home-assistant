      custom_fields:
        yildiz: ' '
        yagis: ' '
        orb: ' '
        selam: "[[[\n  const h = new Date().getHours();\n  const s = h >= 5 && h < 11 ? 'Günaydın' : h < 17 && h >= 11 ? 'İyi günler' : h >= 17 && h < 22 ? 'İyi akşamlar' : 'İyi geceler';\n  const k = states[variables.kisi];\n  const ad = k && k.attributes.friendly_name ? k.attributes.friendly_name.split(' ')[0] : '';\n  return ad ? `${s}, ${ad}` : s;\n]]]\n"
        hava: "[[[\n  const w = states[variables.hava];\n  if (!w || ['unavailable', 'unknown'].includes(w.state)) return '';\n  const ad = {\n    'clear-night': 'Açık', cloudy: 'Bulutlu', fog: 'Sisli', hail: 'Dolu',\n    lightning: 'Gök gürültülü', 'lightning-rainy': 'Fırtına', partlycloudy: 'Parçalı bulutlu',\n    pouring: 'Sağanak', rainy: 'Yağmurlu', snowy: 'Karlı', 'snowy-rainy': 'Karla karışık',\n    sunny: 'Güneşli', windy: 'Rüzgarlı', 'windy-variant': 'Rüzgarlı', exceptional: 'Olağandışı'\n  }[w.state] || w.state;\n  const ik = {\n    'clear-night': 'weather-night', cloudy: 'weather-cloudy', fog: 'weather-fog', hail: 'weather-hail',\n    lightning: 'weather-lightning', 'lightning-rainy': 'weather-lightning-rainy',\n    partlycloudy: 'weather-partly-cloudy', pouring: 'weather-pouring', rainy: 'weather-rainy',\n    snowy: 'weather-snowy', 'snowy-rainy': 'weather-snowy-rainy', sunny: 'weather-sunny',\n    windy: 'weather-windy', 'windy-variant': 'weather-windy-variant'\n  }[w.state] || 'weather-cloudy';\n  const t = parseFloat(w.attributes.temperature);\n  const derece = isNaN(t) ? '' : `<b style=\"font-size:26px;font-weight:300\">${Math.round(t)}°</b>`;\n  return `<div style=\"display:flex;align-items:center;gap:8px\"><ha-icon icon=\"mdi:${ik}\" style=\"--mdc-icon-size:26px\"></ha-icon>${derece}</div>`\n    + `<div style=\"font-size:12px;opacity:.8;text-align:right\">${ad}</div>`;\n]]]\n"
        saat:
          card:
            type: custom:digital-clock
            locale: tr
            timeZone: Europe/Istanbul
            timeFormat: HH:mm
            dateFormat: cccc, d LLLL
            card_mod:
              style: "ha-card {\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n  color: #fff !important;\n  text-align: left !important;\n  padding: 0 !important;\n}\n.first-line { font-size: 64px !important; font-weight: 200 !important; letter-spacing: -2px; line-height: 1 !important; }\n.second-line { font-size: 14px !important; opacity: 0.8; }\n"
        ozet: "[[[\n  const v = variables, S = id => (states[id] || {}).state;\n  const ad = {\n    'binary_sensor.sonoff_a4b0023729_moisture': 'Ayakkabılık',\n    'binary_sensor.sonoff_a4b0023723_moisture': 'Mutfak',\n    'binary_sensor.sonoff_a4b0023728_moisture': 'Büyük Banyo',\n    'binary_sensor.sonoff_a4b0023726_moisture': 'Çamaşır Makinesi',\n    'binary_sensor.sonoff_a4b002372b_moisture': 'Balkon Sol',\n    'binary_sensor.sonoff_a4b002414d_moisture': 'Balkon Sağ',\n    'binary_sensor.sonoff_a4b0023725_moisture': 'Ebeveyn Banyo'\n  };\n  const islak = v.kacak.filter(id => S(id) === 'on').map(id => ad[id] || id);\n  if (islak.length)\n    return `<span style=\"color:#fecaca;font-weight:700\">⚠ Su kaçağı: ${islak.join(', ')}</span>`;\n  const p = [];\n  const isik = v.isiklar.filter(id => S(id) === 'on').length;\n  p.push(isik ? `${isik} ışık açık` : 'Tüm ışıklar kapalı');\n  const isit = v.petekler.filter(id => ((states[id] || {}).attributes || {}).hvac_action === 'heating').length;\n  if (isit) p.push(`${isit} petek ısıtıyor`);\n  if (S(v.kapi) === 'on') p.push('<span style=\"color:#fed7aa\">giriş kapısı açık</span>');\n  const yok = [...v.kacak, v.kapi, ...v.petekler]\n    .filter(id => !S(id) || ['unavailable', 'unknown'].includes(S(id))).length;\n  if (yok) p.push(`<span style=\"color:#fed7aa\">${yok} sensör çevrimdışı</span>`);\n  else if (S(v.kapi) !== 'on') p.push('her şey yolunda');\n  const c = p.join(', ');\n  return c.charAt(0).toUpperCase() + c.slice(1) + '.';\n]]]\n"
      styles:
        card:
        - height: 100%
        - padding: 0
        - border-radius: 28px
        - overflow: hidden
        - position: relative
        - border: 1px solid rgba(255, 255, 255, 0.12)
        - color: '#fff'
        - text-shadow: 0 1px 12px rgba(0, 0, 0, 0.35)
        - background: "[[[\n  const gunes = (states['sun.sun'] || {}).attributes || {};\n  let E = parseFloat(gunes.elevation);\n  if (isNaN(E)) { const h = new Date().getHours(); E = h >= 7 && h < 19 ? 30 : -20; }\n  const faz = E > 12 ? 'gun' : E > -1 ? (gunes.rising ? 'safak' : 'aksam') : E > -8 ? 'alaca' : 'gece';\n  const gok = {\n    gun: 'linear-gradient(180deg, #1d4ed8 0%, #3b82f6 55%, #7dd3fc 100%)',\n    safak: 'linear-gradient(180deg, #312e81 0%, #c2410c 65%, #fdba74 100%)',\n    aksam: 'linear-gradient(180deg, #1e1b4b 0%, #9d174d 55%, #f97316 100%)',\n    alaca: 'linear-gradient(180deg, #0f172a 0%, #312e81 60%, #7c3aed 100%)',\n    gece: 'linear-gradient(180deg, #020617 0%, #0f172a 60%, #1e293b 100%)'\n  }[faz];\n  const c = (states[variables.hava] || {}).state || '';\n  const b = ['cloudy', 'fog'].includes(c) ? 0.5\n    : ['rainy', 'pouring', 'snowy', 'snowy-rainy', 'lightning', 'lightning-rainy', 'hail'].includes(c) ? 0.6\n    : c === 'partlycloudy' ? 0.22 : 0;\n  return `linear-gradient(0deg, rgba(0, 0, 0, 0.45) 0%, transparent 55%),`\n    + ` linear-gradient(rgba(71, 85, 105, ${b}), rgba(100, 116, 139, ${(b * 0.8).toFixed(2)})),`\n    + ` ${gok}`;\n]]]"
        - border: 1px solid rgba(255, 255, 255, 0.18)
        - box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 12px 32px rgba(0, 0, 0, 0.45)
