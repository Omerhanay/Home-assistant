          - height: 44px
          - border-radius: 50%
          - transform: translate(-50%, -50%)
          - pointer-events: none
          - transition: left 2s ease, top 2s ease
          - left: "[[[\n  const gunes = (states['sun.sun'] || {}).attributes || {};\n  const E = parseFloat(gunes.elevation), A = parseFloat(gunes.azimuth);\n  if (isNaN(E) || isNaN(A) || E <= -1) return '66%';\n  return `${(38 + Math.min(Math.max((A - 70) / 220, 0), 1) * 54).toFixed(1)}%`;\n]]]"
          - top: "[[[\n  const gunes = (states['sun.sun'] || {}).attributes || {};\n  const E = parseFloat(gunes.elevation);\n  if (isNaN(E) || E <= -1) return '42%';\n  return `${(30 + Math.min(Math.max(1 - E / 55, 0), 1) * 48).toFixed(1)}%`;\n]]]"
          - background: "[[[\n  const E = parseFloat(((states['sun.sun'] || {}).attributes || {}).elevation);\n  return !isNaN(E) && E > -1\n    ? 'radial-gradient(circle, #fffbeb 0%, #fde68a 45%, #f59e0b 100%)'\n    : 'transparent';\n]]]"
          - box-shadow: "[[[\n  const E = parseFloat(((states['sun.sun'] || {}).attributes || {}).elevation);\n  return !isNaN(E) && E > -1\n    ? '0 0 40px 14px rgba(253, 224, 71, 0.45)'\n    : 'inset -11px 7px 0 0 #f1f5f9, 0 0 30px 4px rgba(241, 245, 249, 0.12)';\n]]]"
          - opacity: "[[[\n  const c = (states[variables.hava] || {}).state || '';\n  return ['cloudy', 'fog', 'rainy', 'pouring', 'snowy', 'snowy-rainy', 'lightning', 'lightning-rainy', 'hail'].includes(c) ? '0.35' : '1';\n]]]"
          yildiz:
          - position: absolute
          - z-index: 0
          - top: 0
          - left: 0
          - width: 2px
          - height: 2px
          - border-radius: 50%
          - pointer-events: none
          - display: "[[[\n  const E = parseFloat(((states['sun.sun'] || {}).attributes || {}).elevation);\n  const c = (states[variables.hava] || {}).state || '';\n  const acik = !['cloudy', 'fog', 'rainy', 'pouring', 'snowy', 'snowy-rainy', 'lightning-rainy', 'hail'].includes(c);\n  return !isNaN(E) && E < -4 && acik ? 'block' : 'none';\n]]]"
          - box-shadow: "[[[\n  let s = 7;\n  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;\n  return Array.from({length: 48}, (_, i) =>\n    `${Math.round(r() * 600)}px ${Math.round(r() * 190)}px 0 ${i % 9 === 0 ? 1 : 0}px rgba(255, 255, 255, ${(0.3 + (i % 5) * 0.14).toFixed(2)})`\n  ).join(', ');\n]]]"
          yagis:
          - position: absolute
          - z-index: 1
          - left: 0
          - right: 0
          - top: -100%
          - height: 200%
          - pointer-events: none
          - opacity: 0.55
          - display: "[[[\n  const c = (states[variables.hava] || {}).state || '';\n  return ['rainy', 'pouring', 'lightning-rainy', 'snowy', 'snowy-rainy', 'hail'].includes(c) ? 'block' : 'none';\n]]]"
          - background: "[[[\n  const c = (states[variables.hava] || {}).state || '';\n  return ['snowy', 'snowy-rainy'].includes(c)\n    ? 'radial-gradient(circle, rgba(255,255,255,.95) 1.5px, transparent 2.2px) 0 0 / 32px 32px, radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1.6px) 16px 11px / 32px 32px'\n    : 'repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 255, 255, 0.35) 22px 23px)';\n]]]"
      extra_styles: "[[[\n  const kapali = (states['input_boolean.dashboard_animasyon'] || {}).state === 'off';\n  if (kapali) return '';\n  const c = (states[variables.hava] || {}).state || '';\n  const kar = ['snowy', 'snowy-rainy'].includes(c);\n  return `\n    #yildiz { animation: gok-parilti 5s ease-in-out infinite; }\n    #yagis { animation: gok-yagis ${kar ? '7s' : c === 'pouring' ? '0.45s' : '0.8s'} linear infinite; }\n    @keyframes gok-parilti { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }\n    @keyframes gok-yagis { from { transform: translateY(0); } to { transform: translateY(50%); } }\n    @media (prefers-reduced-motion: reduce) { #yildiz, #yagis { animation: none; } }\n  `;\n]]]\n"
