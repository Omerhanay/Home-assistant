alias: Günaydın_Otomasyonu
description: >-
  Her sabah 07:00'de, gece Uyku modu kullanıldıysa: petekleri ve hava temizleyiciyi uyku öncesi
  değerlerine döndürür, panel animasyonlarını açar. Saati kendinize göre değiştirin.
triggers:
  - trigger: time
    at: "07:00:00"
conditions:
  - condition: template
    value_template: "{{ states('scene.uyku_oncesi') not in ['unknown', 'unavailable'] }}"
actions:
  # Sahne Uyku modunda geçici olarak oluşturulur; şablonla verildiği için düzenleyici
  # "Varlık bulunamadı" uyarısı göstermez.
  - action: scene.turn_on
    target:
      entity_id: "{{ 'scene.uyku_oncesi' }}"
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.dashboard_animasyon
mode: single
