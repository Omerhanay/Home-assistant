            background-color: rgba(var(--rgb-red-color, 244, 67, 54), 0.14);
            box-shadow: inset 0 0 0 1px rgba(var(--rgb-red-color, 244, 67, 54), 0.6);
            animation: alert-glow 2s ease-in-out infinite;
          }
          @keyframes alert-glow {
            0%, 100% { background-color: rgba(var(--rgb-red-color, 244, 67, 54), 0.10); }
            50% { background-color: rgba(var(--rgb-red-color, 244, 67, 54), 0.24); }
          }
