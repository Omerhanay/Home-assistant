# Ev paneli (tablet, /dashboard-tablet) · sürüm 0v10 · 2026-10-14 · bkz. SURUMLER.md
views:
- title: Ana Sayfa
  path: ana-sayfa
  icon: mdi:tablet-dashboard
  type: sections
  max_columns: 3
  badges: []
  sections:
  - type: grid
    cards:
    - type: custom:button-card
      entity: sun.sun
      show_name: false
      show_icon: false
      show_state: false
      layout: custom
      tap_action:
        action: navigate
        navigation_path: '#hava'
      hold_action:
        action: none
      variables:
        kisi: person.omer
        hava: weather.forecast_home
        kapi: binary_sensor.sonoff_100235874c
        isiklar:
        - light.calisma_odasi_lamba
        - switch.calisma_odasi_kapi_priz
        - switch.kitaplik_led_sonoff_10021d962d_1
        - light.koridor_mutfak
        - light.koridor_kapi
        - light.mutfak_tavan_aydinlatma
        - light.mutfak_uzun_led_aydinlatma
        - light.mutfak_kahve_led
        - light.cocuk_odasi_lamba
        - light.sonoff_10024a8007
        - light.buyuk_banyo_lamba
        - light.yatak_odasi_tavan
        - light.yatak_odasi_led
        - light.salon_lamba_01
        - light.salon_lamba_02
        - light.salon_tavan_led
        - light.balkon_tavan_aydinlatma
        - light.ebeveyn_banyo_aydinlatma
        petekler:
        - climate.sonoff_a4b001d936
        - climate.sonoff_a4b001d937
        - climate.sonoff_a4b001d93a
        - climate.sonoff_a4b001d938
        kacak:
        - binary_sensor.sonoff_a4b0023729_moisture
        - binary_sensor.sonoff_a4b0023723_moisture
        - binary_sensor.sonoff_a4b0023728_moisture
        - binary_sensor.sonoff_a4b0023726_moisture
        - binary_sensor.sonoff_a4b002372b_moisture
        - binary_sensor.sonoff_a4b002414d_moisture
        - binary_sensor.sonoff_a4b0023725_moisture
      triggers_update:
      - weather.forecast_home
      - person.omer
      - binary_sensor.sonoff_100235874c
      - input_boolean.dashboard_animasyon
      - light.calisma_odasi_lamba
      - switch.calisma_odasi_kapi_priz
      - switch.kitaplik_led_sonoff_10021d962d_1
      - light.koridor_mutfak
      - light.koridor_kapi
      - light.mutfak_tavan_aydinlatma
      - light.mutfak_uzun_led_aydinlatma
      - light.mutfak_kahve_led
      - light.cocuk_odasi_lamba
      - light.sonoff_10024a8007
      - light.buyuk_banyo_lamba
      - light.yatak_odasi_tavan
      - light.yatak_odasi_led
      - light.salon_lamba_01
      - light.salon_lamba_02
      - light.salon_tavan_led
      - light.balkon_tavan_aydinlatma
      - light.ebeveyn_banyo_aydinlatma
      - climate.sonoff_a4b001d936
      - climate.sonoff_a4b001d937
      - climate.sonoff_a4b001d93a
      - climate.sonoff_a4b001d938
      - binary_sensor.sonoff_a4b0023729_moisture
      - binary_sensor.sonoff_a4b0023723_moisture
      - binary_sensor.sonoff_a4b0023728_moisture
      - binary_sensor.sonoff_a4b0023726_moisture
      - binary_sensor.sonoff_a4b002372b_moisture
      - binary_sensor.sonoff_a4b002414d_moisture
      - binary_sensor.sonoff_a4b0023725_moisture
      custom_fields:
        yildiz: ' '
        yagis: ' '
        orb: ' '
        selam: |
          [[[
            const h = new Date().getHours();
            const s = h >= 5 && h < 11 ? 'Günaydın' : h < 17 && h >= 11 ? 'İyi günler' : h >= 17 && h < 22 ? 'İyi akşamlar' : 'İyi geceler';
            const k = states[variables.kisi];
            const ad = k && k.attributes.friendly_name ? k.attributes.friendly_name.split(' ')[0] : '';
            return ad ? `${s}, ${ad}` : s;
          ]]]
        hava: |
          [[[
            const w = states[variables.hava];
            if (!w || ['unavailable', 'unknown'].includes(w.state)) return '';
            const ad = {
              'clear-night': 'Açık', cloudy: 'Bulutlu', fog: 'Sisli', hail: 'Dolu',
              lightning: 'Gök gürültülü', 'lightning-rainy': 'Fırtına', partlycloudy: 'Parçalı bulutlu',
              pouring: 'Sağanak', rainy: 'Yağmurlu', snowy: 'Karlı', 'snowy-rainy': 'Karla karışık',
              sunny: 'Güneşli', windy: 'Rüzgarlı', 'windy-variant': 'Rüzgarlı', exceptional: 'Olağandışı'
            }[w.state] || w.state;
            const ik = {
              'clear-night': 'weather-night', cloudy: 'weather-cloudy', fog: 'weather-fog', hail: 'weather-hail',
              lightning: 'weather-lightning', 'lightning-rainy': 'weather-lightning-rainy',
              partlycloudy: 'weather-partly-cloudy', pouring: 'weather-pouring', rainy: 'weather-rainy',
              snowy: 'weather-snowy', 'snowy-rainy': 'weather-snowy-rainy', sunny: 'weather-sunny',
              windy: 'weather-windy', 'windy-variant': 'weather-windy-variant'
            }[w.state] || 'weather-cloudy';
            const t = parseFloat(w.attributes.temperature);
            const derece = isNaN(t) ? '' : `<b style="font-size:26px;font-weight:300">${Math.round(t)}°</b>`;
            return `<div style="display:flex;align-items:center;gap:8px"><ha-icon icon="mdi:${ik}" style="--mdc-icon-size:26px"></ha-icon>${derece}</div>`
              + `<div style="font-size:12px;opacity:.8;text-align:right">${ad}</div>`;
          ]]]
        saat:
          card:
            type: custom:digital-clock
            locale: tr
            timeZone: Europe/Istanbul
            timeFormat: HH:mm
            dateFormat: cccc, d LLLL
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  box-shadow: none !important;
                  border: none !important;
                  color: #fff !important;
                  text-align: left !important;
                  padding: 0 !important;
                }
                .first-line { font-size: 76px !important; font-weight: 200 !important; letter-spacing: -2px; line-height: 1 !important; }
                .second-line { font-size: 14px !important; opacity: 0.8; }
        ozet: |
          [[[
            const v = variables, S = id => (states[id] || {}).state;
            const ad = {
              'binary_sensor.sonoff_a4b0023729_moisture': 'Ayakkabılık',
              'binary_sensor.sonoff_a4b0023723_moisture': 'Mutfak',
              'binary_sensor.sonoff_a4b0023728_moisture': 'Büyük Banyo',
              'binary_sensor.sonoff_a4b0023726_moisture': 'Çamaşır Makinesi',
              'binary_sensor.sonoff_a4b002372b_moisture': 'Balkon Sol',
              'binary_sensor.sonoff_a4b002414d_moisture': 'Balkon Sağ',
              'binary_sensor.sonoff_a4b0023725_moisture': 'Ebeveyn Banyo'
            };
            const islak = v.kacak.filter(id => S(id) === 'on').map(id => ad[id] || id);
            if (islak.length)
              return `<span style="color:#fecaca;font-weight:700">⚠ Su kaçağı: ${islak.join(', ')}</span>`;
            const p = [];
            const isik = v.isiklar.filter(id => S(id) === 'on').length;
            p.push(isik ? `${isik} ışık açık` : 'Tüm ışıklar kapalı');
            const isit = v.petekler.filter(id => ((states[id] || {}).attributes || {}).hvac_action === 'heating').length;
            if (isit) p.push(`${isit} petek ısıtıyor`);
            if (S(v.kapi) === 'on') p.push('<span style="color:#fed7aa">giriş kapısı açık</span>');
            const yok = [...v.kacak, v.kapi, ...v.petekler]
              .filter(id => !S(id) || ['unavailable', 'unknown'].includes(S(id))).length;
            if (yok) p.push(`<span style="color:#fed7aa">${yok} sensör çevrimdışı</span>`);
            else if (S(v.kapi) !== 'on') p.push('her şey yolunda');
            const c = p.join(', ');
            return c.charAt(0).toUpperCase() + c.slice(1) + '.';
          ]]]
      styles:
        card:
        - height: 100%
        - padding: 0
        - border-radius: 28px
        - overflow: hidden
        - position: relative
        - border: 1px solid rgba(255, 255, 255, 0.12)
        - color: '#fff'
        - text-shadow: 0 1px 12px rgba(0, 0, 0, 0.35)
        - background: |-
            [[[
              const sun = (states['sun.sun'] || {}).attributes || {};
              let E = parseFloat(sun.elevation);
              if (isNaN(E)) { const h = new Date().getHours(); E = h >= 7 && h < 19 ? 30 : -20; }
              const faz = E > 12 ? 'gun' : E > -1 ? (sun.rising ? 'safak' : 'aksam') : E > -8 ? 'alaca' : 'gece';
              const gok = {
                gun: 'linear-gradient(180deg, #1d4ed8 0%, #3b82f6 55%, #7dd3fc 100%)',
                safak: 'linear-gradient(180deg, #312e81 0%, #c2410c 65%, #fdba74 100%)',
                aksam: 'linear-gradient(180deg, #1e1b4b 0%, #9d174d 55%, #f97316 100%)',
                alaca: 'linear-gradient(180deg, #0f172a 0%, #312e81 60%, #7c3aed 100%)',
                gece: 'linear-gradient(180deg, #020617 0%, #0f172a 60%, #1e293b 100%)'
              }[faz];
              const c = (states[variables.hava] || {}).state || '';
              const b = ['cloudy', 'fog'].includes(c) ? 0.5
                : ['rainy', 'pouring', 'snowy', 'snowy-rainy', 'lightning', 'lightning-rainy', 'hail'].includes(c) ? 0.6
                : c === 'partlycloudy' ? 0.22 : 0;
              return `linear-gradient(0deg, rgba(0, 0, 0, 0.45) 0%, transparent 55%),`
                + ` linear-gradient(rgba(71, 85, 105, ${b}), rgba(100, 116, 139, ${(b * 0.8).toFixed(2)})),`
                + ` ${gok}`;
            ]]]
        grid:
        - position: static
        - grid-template-areas: '"selam hava" "saat saat" "ozet ozet"'
        - grid-template-columns: 1fr auto
        - grid-template-rows: auto 1fr auto
        - height: 100%
        - padding: 18px 22px
        - box-sizing: border-box
        custom_fields:
          selam:
          - justify-self: start
          - align-self: start
          - font-size: 17px
          - font-weight: 600
          - position: relative
          - z-index: 2
          hava:
          - justify-self: end
          - align-self: start
          - position: relative
          - z-index: 2
          saat:
          - justify-self: start
          - align-self: center
          - position: relative
          - z-index: 2
          ozet:
          - justify-self: start
          - font-size: 14px
          - line-height: 1.4
          - opacity: 0.95
          - position: relative
          - z-index: 2
          orb:
          - position: absolute
          - z-index: 1
          - width: 44px
          - height: 44px
          - border-radius: 50%
          - transform: translate(-50%, -50%)
          - pointer-events: none
          - transition: left 2s ease, top 2s ease
          - left: |-
              [[[
                const sun = (states['sun.sun'] || {}).attributes || {};
                const E = parseFloat(sun.elevation), A = parseFloat(sun.azimuth);
                if (isNaN(E) || isNaN(A) || E <= -1) return '66%';
                return `${(38 + Math.min(Math.max((A - 70) / 220, 0), 1) * 54).toFixed(1)}%`;
              ]]]
          - top: |-
              [[[
                const sun = (states['sun.sun'] || {}).attributes || {};
                const E = parseFloat(sun.elevation);
                if (isNaN(E) || E <= -1) return '42%';
                return `${(30 + Math.min(Math.max(1 - E / 55, 0), 1) * 48).toFixed(1)}%`;
              ]]]
          - background: |-
              [[[
                const E = parseFloat(((states['sun.sun'] || {}).attributes || {}).elevation);
                return !isNaN(E) && E > -1
                  ? 'radial-gradient(circle, #fffbeb 0%, #fde68a 45%, #f59e0b 100%)'
                  : 'transparent';
              ]]]
          - box-shadow: |-
              [[[
                const E = parseFloat(((states['sun.sun'] || {}).attributes || {}).elevation);
                return !isNaN(E) && E > -1
                  ? '0 0 40px 14px rgba(253, 224, 71, 0.45)'
                  : 'inset -11px 7px 0 0 #f1f5f9, 0 0 30px 4px rgba(241, 245, 249, 0.12)';
              ]]]
          - opacity: |-
              [[[
                const c = (states[variables.hava] || {}).state || '';
                return ['cloudy', 'fog', 'rainy', 'pouring', 'snowy', 'snowy-rainy', 'lightning', 'lightning-rainy', 'hail'].includes(c) ? '0.35' : '1';
              ]]]
          yildiz:
          - position: absolute
          - z-index: 0
          - top: 0
          - left: 0
          - width: 2px
          - height: 2px
          - border-radius: 50%
          - pointer-events: none
          - display: |-
              [[[
                const E = parseFloat(((states['sun.sun'] || {}).attributes || {}).elevation);
                const c = (states[variables.hava] || {}).state || '';
                const acik = !['cloudy', 'fog', 'rainy', 'pouring', 'snowy', 'snowy-rainy', 'lightning-rainy', 'hail'].includes(c);
                return !isNaN(E) && E < -4 && acik ? 'block' : 'none';
              ]]]
          - box-shadow: |-
              [[[
                let s = 7;
                const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
                return Array.from({length: 48}, (_, i) =>
                  `${Math.round(r() * 600)}px ${Math.round(r() * 190)}px 0 ${i % 9 === 0 ? 1 : 0}px rgba(255, 255, 255, ${(0.3 + (i % 5) * 0.14).toFixed(2)})`
                ).join(', ');
              ]]]
          yagis:
          - position: absolute
          - z-index: 1
          - left: 0
          - right: 0
          - top: -100%
          - height: 200%
          - pointer-events: none
          - opacity: 0.55
          - display: |-
              [[[
                const c = (states[variables.hava] || {}).state || '';
                return ['rainy', 'pouring', 'lightning-rainy', 'snowy', 'snowy-rainy', 'hail'].includes(c) ? 'block' : 'none';
              ]]]
          - background: |-
              [[[
                const c = (states[variables.hava] || {}).state || '';
                return ['snowy', 'snowy-rainy'].includes(c)
                  ? 'radial-gradient(circle, rgba(255,255,255,.95) 1.5px, transparent 2.2px) 0 0 / 32px 32px, radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1.6px) 16px 11px / 32px 32px'
                  : 'repeating-linear-gradient(100deg, transparent 0 22px, rgba(255, 255, 255, 0.35) 22px 23px)';
              ]]]
      extra_styles: |
        [[[
          const kapali = (states['input_boolean.dashboard_animasyon'] || {}).state === 'off';
          if (kapali) return '';
          const c = (states[variables.hava] || {}).state || '';
          const kar = ['snowy', 'snowy-rainy'].includes(c);
          return `
            #yildiz { animation: gok-parilti 5s ease-in-out infinite; }
            #yagis { animation: gok-yagis ${kar ? '7s' : c === 'pouring' ? '0.45s' : '0.8s'} linear infinite; }
            @keyframes gok-parilti { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
            @keyframes gok-yagis { from { transform: translateY(0); } to { transform: translateY(50%); } }
            @media (prefers-reduced-motion: reduce) { #yildiz, #yagis { animation: none; } }
          `;
        ]]]
      grid_options:
        columns: full
        rows: 4
