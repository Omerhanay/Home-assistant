              {% endif %}
            }
    - type: custom:mushroom-entity-card
      entity: switch.tv_priz
      name: TV Priz
      icon: mdi:power-plug
      icon_color: teal
      secondary_info: state
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      grid_options:
        columns: 6
    - type: custom:mushroom-entity-card
      entity: switch.playstation_5_priz
      name: PlayStation 5
      icon: mdi:controller
      icon_color: purple
      secondary_info: state
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      grid_options:
        columns: full
    - type: custom:mushroom-climate-card
      entity: climate.sonoff_a4b001d938
      name: Petek
      hvac_modes:
      - auto
      - heat
      - 'off'
      show_temperature_control: true
      collapsible_controls: false
      tap_action:
        action: more-info
      grid_options:
        columns: full
      card_mod:
        style:
          mushroom-shape-icon$: |
            .shape {
              {% if state_attr(config.entity, 'hvac_action') == 'heating' %}
              animation: heat-pulse 3s ease-in-out infinite;
              {% endif %}
            }
            @keyframes heat-pulse {
              0%, 100% { box-shadow: 0 0 0 0 rgba(var(--rgb-deep-orange-color, 255, 87, 34), 0); }
              50% { box-shadow: 0 0 14px 3px rgba(var(--rgb-deep-orange-color, 255, 87, 34), 0.45); }
            }
            @media (prefers-reduced-motion: reduce) { .shape { animation: none !important; } }
