      chips:
      - type: template
        icon: mdi:lightbulb-group
        icon_color: '{{ ''amber'' if states.light | selectattr(''state'', ''eq'', ''on'') | list | count > 0 else ''grey'' }}'
        content: '{{ states.light | selectattr(''state'', ''eq'', ''on'') | list | count }} ışık açık'
        tap_action:
          action: none
      - type: template
        icon: mdi:home-thermometer
        icon_color: deep-orange
        content: '{% set t = [''sensor.sonoff_a4b001d936_temperature'', ''sensor.sonoff_a4b001d937_temperature'', ''sensor.sonoff_a4b001d93a_temperature'', ''sensor.sonoff_a4b001d938_temperature''] | map(''states'') | select(''is_number'') | map(''float'') | list %}İç ort. {{ (t | sum / t | count) | round(1) ~ '' °C'' if t | count > 0 else ''–'' }}'
        tap_action:
          action: none
      grid_options:
        columns: full
    - type: markdown
      content: <ha-icon icon="mdi:shield-check"></ha-icon> **Her şey yolunda** · su kaçağı yok, kapı kapalı
      visibility:
      - condition: state
        entity: binary_sensor.sonoff_a4b0023729_moisture
