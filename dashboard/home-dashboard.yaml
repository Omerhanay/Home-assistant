views:
- title: Ana Sayfa
  path: ana-sayfa
  icon: mdi:home
  type: sections
  max_columns: 4
  badges:
  - type: entity
    entity: person.omer
    name: Ömer
    show_name: true
    show_state: true
    show_icon: true
    show_entity_picture: true
    tap_action:
      action: none
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Ev Durumu
      heading_style: title
      icon: mdi:home-heart
    - type: custom:mushroom-chips-card
      alignment: start
      chips:
      - type: template
        icon: mdi:lightbulb-group
        icon_color: '{{ ''amber'' if states.light | selectattr(''state'', ''eq'', ''on'') | list | count > 0 else ''grey'' }}'
        content: '{{ states.light | selectattr(''state'', ''eq'', ''on'') | list | count }} ışık açık'
        tap_action:
          action: none
      - type: template
        icon: mdi:home-thermometer
        icon_color: orange
        content: '{% set t = [''sensor.sonoff_a4b001d936_temperature'', ''sensor.sonoff_a4b001d937_temperature'', ''sensor.sonoff_a4b001d93a_temperature'', ''sensor.sonoff_a4b001d938_temperature''] | map(''states'') | select(''is_number'') | map(''float'') | list %}İç ort. {{ (t | sum / t | count) | round(1) if t | count > 0 else ''–'' }} °C'
        tap_action:
          action: none
      grid_options:
        columns: full
    - type: markdown
      content: <ha-icon icon="mdi:shield-check"></ha-icon> **Her şey yolunda** · su kaçağı yok, kapı kapalı
      visibility:
      - condition: state
        entity: binary_sensor.sonoff_a4b0023729_moisture
        state: 'off'
      - condition: state
        entity: binary_sensor.sonoff_a4b0023723_moisture
        state: 'off'
      - condition: state
        entity: binary_sensor.sonoff_a4b0023728_moisture
        state: 'off'
      - condition: state
        entity: binary_sensor.sonoff_a4b0023726_moisture
        state: 'off'
      - condition: state
        entity: binary_sensor.sonoff_a4b002372b_moisture
        state: 'off'
      - condition: state
        entity: binary_sensor.sonoff_a4b002414d_moisture
        state: 'off'
      - condition: state
        entity: binary_sensor.sonoff_a4b0023725_moisture
        state: 'off'
      - condition: state
        entity: binary_sensor.sonoff_100235874c
        state: 'off'
      grid_options:
        columns: full
    - type: tile
      entity: binary_sensor.sonoff_100235874c
      name: Kapı açık
      icon: mdi:door-open
      color: red
      visibility:
      - condition: state
        entity: binary_sensor.sonoff_100235874c
