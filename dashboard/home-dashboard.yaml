                --icon-color-disabled: rgb(var(--rgb-red-color, 244, 67, 54)) !important;
                --shape-color: rgba(var(--rgb-red-color, 244, 67, 54), 0.2) !important;
                --shape-color-disabled: rgba(var(--rgb-red-color, 244, 67, 54), 0.2) !important;
                  {% elif states(config.entity) in ['unavailable', 'unknown'] %}
                --icon-color: rgb(var(--rgb-disabled-color, 189, 189, 189)) !important;
                --icon-color-disabled: rgb(var(--rgb-disabled-color, 189, 189, 189)) !important;
                --shape-color: rgba(var(--rgb-disabled-color, 189, 189, 189), 0.2) !important;
                --shape-color-disabled: rgba(var(--rgb-disabled-color, 189, 189, 189), 0.2) !important;
                  {% else %}
                --icon-color: rgb(var(--rgb-green-color, 76, 175, 80)) !important;
                --icon-color-disabled: rgb(var(--rgb-green-color, 76, 175, 80)) !important;
                --shape-color: rgba(var(--rgb-green-color, 76, 175, 80), 0.2) !important;
                --shape-color-disabled: rgba(var(--rgb-green-color, 76, 175, 80), 0.2) !important;
                  {% endif %}
            }
            ha-card {
              transition: background-color 0.4s ease;
              {% if is_state(config.entity, 'on') %}
              background-color: rgba(var(--rgb-red-color, 244, 67, 54), 0.14);
              box-shadow: inset 0 0 0 1px rgba(var(--rgb-red-color, 244, 67, 54), 0.6);
              {% endif %}
            }
          mushroom-shape-icon$: |
            .shape {
              {% if is_state(config.entity, 'on') %}
              animation: alert-pulse 1.6s ease-out infinite !important;
              {% endif %}
            }
            @keyframes alert-pulse {
              0% { box-shadow: 0 0 0 0 rgba(var(--rgb-red-color, 244, 67, 54), 0.6); }
              100% { box-shadow: 0 0 0 12px rgba(var(--rgb-red-color, 244, 67, 54), 0); }
            }
            @media (prefers-reduced-motion: reduce) { .shape { animation: none !important; } }
