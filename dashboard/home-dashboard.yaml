views:
- title: Ana Sayfa
  path: ana-sayfa
  icon: mdi:home
  type: sections
  max_columns: 4
  badges:
  - type: entity
    entity: person.omer
    name: Ömer
    show_name: true
    show_state: true
    show_icon: true
    show_entity_picture: true
    tap_action:
      action: none
  sections:
