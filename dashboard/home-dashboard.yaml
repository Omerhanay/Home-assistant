- title: Odalar
  path: odalar
  icon: mdi:floor-plan
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Salon
      heading_style: title
      icon: mdi:sofa
      badges:
      - type: entity
        entity: sensor.sonoff_a4b001d938_temperature
        show_icon: true
        show_state: true
        color: deep-orange
        tap_action:
          action: more-info
    - type: custom:mushroom-light-card
      entity: light.salon_lamba_01
      name: Tavan Lamba 1
      icon_color: amber
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: false
      secondary_info: state
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      grid_options:
        columns: 6
      card_mod:
        style:
          mushroom-shape-icon$: |
            .shape {
              transition: box-shadow 0.4s ease;
              {% if is_state(config.entity, 'on') %}
              box-shadow: 0 0 16px -2px var(--icon-color);
              {% endif %}
            }
    - type: custom:mushroom-light-card
      entity: light.salon_lamba_02
      name: Tavan Lamba 2
      icon_color: amber
      use_light_color: true
      show_brightness_control: true
      collapsible_controls: false
      secondary_info: state
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      grid_options:
        columns: 6
      card_mod:
        style:
