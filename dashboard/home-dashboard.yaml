- title: Odalar
  path: odalar
  icon: mdi:floor-plan
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Çalışma Odası
      heading_style: title
      icon: mdi:monitor-dashboard
      badges:
      - type: entity
        entity: sensor.sonoff_a4b001d936_temperature
        show_icon: true
        show_state: true
        color: orange
        tap_action:
          action: more-info
    - type: custom:mushroom-light-card
      entity: light.calisma_odasi_lamba
      name: Lamba
      icon_color: amber
      use_light_color: true
      show_brightness_control: true
      show_color_temp_control: true
      show_color_control: true
      collapsible_controls: true
      secondary_info: state
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      grid_options:
        columns: 6
      card_mod:
        style:
          mushroom-shape-icon$: |
            .shape {
              transition: box-shadow 0.4s ease;
              {% if is_state(config.entity, 'on') %}
              box-shadow: 0 0 0 3px var(--shape-color), 0 0 16px 2px var(--shape-color);
              {% endif %}
            }
    - type: custom:mushroom-entity-card
      entity: switch.calisma_odasi_kapi_priz
      name: Kitaplık Led Trafo
      icon: mdi:power-plug
      icon_color: yellow
      secondary_info: state
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      grid_options:
        columns: 6
      card_mod:
        style:
          mushroom-shape-icon$: |
            .shape {
              transition: box-shadow 0.4s ease;
              {% if is_state(config.entity, 'on') %}
              box-shadow: 0 0 0 3px var(--shape-color), 0 0 16px 2px var(--shape-color);
              {% endif %}
            }
    - type: custom:mushroom-template-card
      entity: fan.zhimi_sg_918358888_meb1_s_2_air_purifier
      primary: Kokuştroşko
      secondary: '{% set p = state_attr(entity, ''preset_mode'') %}{{ state_translated(entity) if not is_state(entity, ''on'') else (p or state_translated(entity)) }} · PM2.5 {{ states(''sensor.zhimi_sg_918358888_meb1_pm2_5_density_p_3_4'') }} · Filtre %{{ states(''sensor.zhimi_sg_918358888_meb1_filter_life_level_p_4_1'') }}'
      icon: mdi:air-purifier
      icon_color: '{% if not is_state(entity, ''on'') %}grey{% elif states(''sensor.zhimi_sg_918358888_meb1_pm2_5_density_p_3_4'') | float(0) > 50 %}red{% elif states(''sensor.zhimi_sg_918358888_meb1_pm2_5_density_p_3_4'') | float(0) > 25 %}orange{% else %}light-blue{% endif %}'
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      grid_options:
        columns: full
      card_mod:
        style:
          mushroom-shape-icon$: |
            .shape {
              transition: box-shadow 0.4s ease;
              {% if is_state(config.entity, 'on') %}
              box-shadow: 0 0 0 3px var(--shape-color), 0 0 16px 2px var(--shape-color);
              {% endif %}
            }
    - type: custom:mushroom-climate-card
      entity: climate.sonoff_a4b001d936
      name: Petek
      hvac_modes:
      - auto
      - heat
      - 'off'
      show_temperature_control: true
      collapsible_controls: false
      tap_action:
        action: more-info
      grid_options:
        columns: full
      card_mod:
        style:
          mushroom-shape-icon$: |
            .shape {
              {% if state_attr(config.entity, 'hvac_action') == 'heating' %}
              animation: heat-pulse 3s ease-in-out infinite;
              {% endif %}
            }
            @keyframes heat-pulse {
              0%, 100% { box-shadow: 0 0 0 0 rgba(255, 112, 67, 0); }
              50% { box-shadow: 0 0 14px 3px rgba(255, 112, 67, 0.45); }
            }
            @media (prefers-reduced-motion: reduce) { .shape { animation: none !important; } }
  - type: grid
