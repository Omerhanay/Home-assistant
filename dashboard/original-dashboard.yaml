            entity: input_boolean.tum_isiklar_kapali_section
          - show_name: true
            show_icon: true
            icon: mdi:snowflake-thermometer
            type: button
            tap_action:
              action: toggle
            grid_options:
              rows: 1,5
              columns: 3
            theme: ios-dark-mode-blue-red
            show_state: false
            name: Tüm Petekler Açık
            entity: input_boolean.tum_petekler_acik_section
          - show_name: true
            show_icon: true
            icon: mdi:sun-thermometer
            type: button
            tap_action:
              action: toggle
            grid_options:
              rows: 1,5
              columns: 3
            theme: ios-dark-mode-blue-red
            show_state: false
            name: Tüm Petekler Kapalı
            entity: input_boolean.tum_petekler_kapali_section
          - show_name: true
            show_icon: true
            icon: mdi:power-plug-battery-outline
            type: button
            tap_action:
              action: toggle
            grid_options:
              rows: 1,5
              columns: 3
            theme: ios-dark-mode-blue-red
            show_state: false
            name: Tüm Prizler Kapalı
            entity: input_boolean.tum_prizler_kapali_section
          - show_name: true
            show_icon: true
            icon: mdi:power-plug-battery
            type: button
            tap_action:
              action: toggle
            grid_options:
              rows: 1,5
