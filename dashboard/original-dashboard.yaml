          - type: custom:mushroom-entity-card
            entity: binary_sensor.sonoff_a4b0023729_moisture
            tap_action:
              action: more-info
            name: Ayakkabılık Su Kaçak Sensörü
            icon: mdi:pipe-leak
            primary_info: name
            secondary_info: none
            icon_color: white
            grid_options:
              columns: 8
              rows: 1
            card_mod:
              style: |
                ha-card {
                  /* ===== LOGIC & SETTINGS ===== */
                  {% set level = 70 %}
                  {% set rgb = '29, 130, 150' %}
                  {% set sensor_on = is_state(config.entity, 'on') %}

                  /* ===== VARIABLE ==== */
                  --liq-color: rgb({{ rgb }});
                  --liq-level: {{ level }}%;
                  --wave-speed: 1.5s;

                  /* ===== FONT SETTINGS ==== */
                  --card-primary-font-size: 16px !important;
                  --card-secondary-font-size: 12px !important;
                  --card-primary-font-weight: bold !important;

                  background-color: #1c1c1c !important;

                  {% if sensor_on %}
                  background-image:
                    linear-gradient(
                      90deg,
                      rgba({{ rgb }}, 1) 0%,
                      rgba({{ rgb }}, 1) {{ level -10 }}%,
                      transparent {{ level }}%,
                      transparent 100%
                    ) !important;
                  {% else %}
                  background-image: none !important;
                  {% endif %}

                  border-radius: 12px;
                  position: relative;
                  overflow: hidden;
                  z-index: 0;
                  transition: all 0.5s ease;
                }

                /* ===== WET/DRY BADGE  ===== */
                ha-card::before {
                  {% set label = 'Wet' if sensor_on else 'Dry' %}
                  content: '{{ label }}';
                  position: absolute;
                  top: 30%;
                  right: 10px;

                  font-size: 1.1rem;
                  font-weight: 700;

                  color: {{ 'rgb(50,151,200)' if sensor_on else 'white' }};
                  background: rgba(0, 0, 0, 0.3);
                  border: 1px solid rgba(255, 255, 255, 0.1);
                  padding: 2px 8px;
                  border-radius: 6px;
                  z-index: 3;
                  pointer-events: none;
                }

                /* ===== LAYER: THE SPINNING WAVE ===== */
                ha-card::after {
                  content: "";
                  position: absolute;
                  z-index: -1;

                  /* Show wave only when sensor is ON and level is between 0 and 100 */
                  display: {{
                    'block'
                    if sensor_on and level > 0 and level < 100
                    else 'none'
                  }};

                  width: 120px;
                  height: 120px;

                  background: var(--liq-color);
                  box-shadow: 0 0 25px rgba({{ rgb }}, 0.5);
                  border-radius: 40%;

                  left: calc(var(--liq-level) - 120px);
                  top: calc(50% - 60px);

                  animation: spin-wave var(--wave-speed) linear infinite;
                  transition: left 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
                }

                /* ===== ENSURE CONTENT IS ON TOP ===== */
                .mushroom-state-item {
                  z-index: 2;
                  position: relative;
                  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
                }

                /* ===== ICON + SHAPE STATE COLORS ===== */
                mushroom-shape-icon {
                  --icon-size: 68px;
                  display: flex;
                  margin: -18px 0 10px -18px !important;
                  padding-right: 15px;
                  z-index: 2;

                  /* Shape blue tinted when OFF */
                  {% if not sensor_on %}
                    --shape-color: rgba({{ rgb }}, 0.25);
                  {% endif %}
                }

                /* Icon color changes with state */
                ha-state-icon {
                  color: {{
                    'white'
                    if sensor_on
                    else 'rgb(50,151,200)'
                  }} !important;

                  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
                }

                /* ===== NIMATION ===== */
                @keyframes spin-wave {
                  0% { transform: rotate(0deg); }
                  100% { transform: rotate(360deg); }
                }
          - type: custom:mushroom-entity-card
