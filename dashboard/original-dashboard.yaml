            card_mod:
              style:
                mushroom-shape-icon$: |
                  .shape {
                    {# ========== USER CONFIG ========== #}
                    {% set state_entity    = 'light.ebeveyn_banyo_aydinlatma' %}
                    {% set active_value    = 'on' %}

                    {# ======== TRIGGER ======== #}
                      {% set trigger_active = (states(state_entity) == active_value) %}

                    {# ======== COLOR FROM ENTITY (rgb_color) ======== #}
                    {% set rgb = state_attr(config.entity, 'rgb_color') %}
                    {% if rgb is not none %}
                      {% set r = (rgb[0] | int) %}
                      {% set g = (rgb[1] | int) %}
                      {% set b = (rgb[2] | int) %}
                    {% else %}
                      {# fallback for CT-only lights #}
                      {% set r = 255 %}
                      {% set g = 240 %}
                      {% set b = 200 %}
                    {% endif %}

                    {% if trigger_active %}
                      --shape-animation: lamp-sweep 1.8s ease-in-out infinite;
                      opacity: 1;
                    {% else %}
                      --shape-animation: none;
                      opacity: 0.5;
                    {% endif %}

                    position: relative;
                    transform-origin: 50% 60%;
                  }

