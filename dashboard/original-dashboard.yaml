            theme: ios-dark-mode-blue-red
            show_state: false
            name: Tatil Modu
            entity: input_boolean.tatil_modu_section
            color: accent
          - show_name: true
            show_icon: true
            icon: mdi:sleep
            type: button
            tap_action:
              action: toggle
            grid_options:
              rows: 1,5
              columns: 3
            theme: ios-dark-mode-blue-red
            show_state: false
